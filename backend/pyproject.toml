[project]
name = "multimodal-customer-service-agent"
version = "0.7.0"
description = "Evidence-first multimodal customer service agent"
requires-python = ">=3.13"
dependencies = [
  "cryptography>=45.0.0",
  "fastapi>=0.116.0",
  "httpx>=0.28.0",
  "jieba>=0.42.1",
  "pymupdf>=1.26.0",
  "pydantic-settings>=2.10.0",
  "psycopg[binary]>=3.2.9",
  "python-docx>=1.2.0",
  "python-multipart>=0.0.20",
  "sqlmodel>=0.0.24",
  "uvicorn[standard]>=0.35.0",
  "numpy>=2.3.0",
  "umap-learn>=0.5.12",
  "joblib>=1.5.0",
  "numba>=0.66.0",
]

[dependency-groups]
dev = [
  "pytest>=8.4.0",
  "pytest-asyncio>=1.0.0",
]

[tool.pytest.ini_options]
addopts = "-ra"
pythonpath = ["."]
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
